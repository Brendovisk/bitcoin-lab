services:
  bitcoin-core:
    image: lncm/bitcoind:v27.0
    env_file:
      - /api/.env
    restart: unless-stopped
    volumes:
      - bitcoin-data:/data/.bitcoin
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=${BITCOIN_RPC_USER}
      - -rpcpassword=${BITCOIN_RPC_PASS}
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -zmqpubhashblock=tcp://0.0.0.0:28332
      - -zmqpubhashtx=tcp://0.0.0.0:28333
      - -fallbackfee=0.00001
      - -txindex=1
    healthcheck:
      test:
        - CMD
        - bitcoin-cli
        - -regtest
        - -rpcuser=${BITCOIN_RPC_USER}
        - -rpcpassword=${BITCOIN_RPC_PASS}
        - -rpcport=18443
        - getblockchaininfo
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REGTEST_RPC_HOST: bitcoin-core
      REGTEST_RPC_PORT: 18443
      REGTEST_RPC_USER: ${BITCOIN_RPC_USER}
      REGTEST_RPC_PASS: ${BITCOIN_RPC_PASS}
      ZMQ_HASHBLOCK_URL: tcp://bitcoin-core:28332
      ZMQ_HASHTX_URL: tcp://bitcoin-core:28333
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      bitcoin-core:
        condition: service_healthy

volumes:
  bitcoin-data:
